# Optional convenience wrapper — equivalent to scripts/start_mac.sh.
#   docker compose up -d --build     # start (http://localhost:8000)
#   docker compose down              # stop (data in the finally-data volume is kept)
services:
  finally:
    build: .
    image: finally
    container_name: finally
    ports:
      - "8000:8000"
    volumes:
      - finally-data:/app/db
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

volumes:
  finally-data:
    name: finally-data
